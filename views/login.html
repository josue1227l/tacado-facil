<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atacado Fácil - Acesso</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .acesso-container {
            max-width: 420px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .acesso-container h1 {
            text-align: center;
            color: #166534;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .formulario-acesso {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .formulario-acesso label {
            font-weight: bold;
        }

        .formulario-acesso input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .formulario-acesso button {
            padding: 12px;
            background: #15803d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 8px;
        }

        .formulario-acesso button:hover {
            background: #166534;
        }

        .alternar {
            text-align: center;
            margin-top: 20px;
        }

        .alternar button {
            border: none;
            background: none;
            color: #15803d;
            cursor: pointer;
            font-weight: bold;
        }

        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .oculto {
            display: none;
        }
    </style>
</head>

<body>
    <main class="acesso-container">
        <h1>Atacado Fácil</h1>
        <p class="subtitulo">Sistema de Gestão de Atacado</p>

        <!-- Formulário de login -->
        <form id="formLogin" class="formulario-acesso">
            <h2>Entrar</h2>

            <label for="loginEmail">E-mail</label>
            <input
                type="email"
                id="loginEmail"
                required
                placeholder="Digite seu e-mail"
            >

            <label for="loginSenha">Senha</label>
            <input
                type="password"
                id="loginSenha"
                required
                placeholder="Digite sua senha"
            >

            <button type="submit">Entrar no sistema</button>
        </form>

        <!-- Formulário de cadastro -->
        <form id="formCadastro" class="formulario-acesso oculto">
            <h2>Criar conta</h2>

            <label for="cadastroNome">Nome completo</label>
            <input
                type="text"
                id="cadastroNome"
                required
                placeholder="Digite seu nome"
            >

            <label for="cadastroEmail">E-mail</label>
            <input
                type="email"
                id="cadastroEmail"
                required
                placeholder="Digite seu e-mail"
            >

            <label for="cadastroSenha">Senha</label>
            <input
                type="password"
                id="cadastroSenha"
                required
                minlength="8"
                placeholder="Mínimo de 8 caracteres"
            >

            <button type="submit">Cadastrar</button>
        </form>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <div class="alternar">
            <span id="textoAlternar">Ainda não tem uma conta?</span>
            <button type="button" id="botaoAlternar">
                Criar conta
            </button>
        </div>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
