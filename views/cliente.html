<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atacado Fácil - Catálogo</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .pagina-cliente {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .cabecalho-cliente {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
        }

        .cabecalho-cliente h1 {
            color: #166534;
            margin: 0;
        }

        .botao-sair {
            background: #dc2626;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 10px 16px;
            cursor: pointer;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .produto-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }

        .produto-card h3 {
            color: #166534;
            margin-top: 0;
        }

        .produto-preco {
            font-size: 22px;
            font-weight: bold;
            color: #15803d;
        }

        .produto-info {
            color: #555;
            margin: 8px 0;
        }

        .campo-quantidade {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 15px;
        }

        .campo-quantidade input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
        }

        .botao-comprar {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background: #15803d;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .botao-comprar:hover {
            background: #166534;
        }

        .botao-comprar:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .mensagem {
            margin: 15px 0;
            font-weight: bold;
        }

        .secao-pedidos {
            margin-top: 45px;
        }

        .pedido-card {
            background: white;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .pedido-card h3 {
            color: #166534;
        }
    </style>
</head>

<body>
    <main class="pagina-cliente">
        <header class="cabecalho-cliente">
            <div>
                <h1>Atacado Fácil</h1>
                <p>Bem-vindo ao nosso catálogo de produtos!</p>
            </div>

            <button type="button" class="botao-sair" id="botaoSair">
                Sair da conta
            </button>
        </header>

        <section>
            <h2>Produtos disponíveis</h2>
            <p>Escolha os produtos e informe a quantidade desejada.</p>

            <p id="mensagemCatalogo" class="mensagem" role="status"></p>

            <div id="catalogoProdutos" class="catalogo">
                <p>Carregando produtos...</p>
            </div>
        </section>

        <section class="secao-pedidos">
            <h2>Meus pedidos</h2>
            <p>Acompanhe as compras que você realizou.</p>

            <p id="mensagemPedidos" class="mensagem" role="status"></p>

            <div id="listaPedidos">
                <p>Carregando pedidos...</p>
            </div>
        </section>
    </main>

    <script src="/js/cliente.js"></script>
</body>
</html>
